# Match the local visual index. Streamlit 1.52.1 loads this beside app.py,
# so other CFA apps keep their own themes.
[theme]
base = "dark"
primaryColor = "#d4b582"
backgroundColor = "#11151b"
secondaryBackgroundColor = "#1b232e"
textColor = "#edf0f5"
borderColor = "#394453"
showWidgetBorder = true
showSidebarBorder = true
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 15
linkColor = "#c7dbed"
codeBackgroundColor = "#0d1725"
codeTextColor = "#eef3fb"
greenColor = "#88b59e"
greenBackgroundColor = "#284c3e"
greenTextColor = "#d1f0dd"
orangeColor = "#d4b582"
orangeBackgroundColor = "#55462f"
orangeTextColor = "#ffe3b0"
blueColor = "#8bbcf6"
blueBackgroundColor = "#314964"
blueTextColor = "#dcecff"
grayColor = "#92a1b5"
grayBackgroundColor = "#354255"
grayTextColor = "#dce5f2"
redColor = "#d495a9"
redBackgroundColor = "#59313e"
redTextColor = "#f6dae4"
violetColor = "#c3a1fa"
violetBackgroundColor = "#44315e"
violetTextColor = "#f0dfff"

[theme.sidebar]
primaryColor = "#d4b582"
backgroundColor = "#171d25"
secondaryBackgroundColor = "#1b232e"
textColor = "#edf0f5"
borderColor = "#2a333e"
