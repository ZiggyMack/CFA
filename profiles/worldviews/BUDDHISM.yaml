profile:
  name: "Buddhism"
  version: "0.1.0"
  status: "DRAFT"
  declared_axiom: "Suffering (dukkha) is the fundamental condition of conditioned existence; its cause is craving (tanha); its cessation (nirvana) is possible; the Eightfold Path is the means to that cessation"
  alternate_names:
