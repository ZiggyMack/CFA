# Axioms: Foundational unprovable assumptions
axioms:
  - name: "Four Noble Truths"
    description: "Suffering exists (dukkha); it has a cause (tanha/craving); it can cease (nirvana); the Eightfold Path leads to cessation"

  - name: "Eightfold Path"
    description: "Right view, intention, speech, action, livelihood, effort, mindfulness, and concentration constitute the path to liberation"

  - name: "Three Marks of Existence"
    description: "All conditioned phenomena are impermanent (anicca), characterized by suffering (dukkha), and without fixed self (anatta)"

  - name: "Karma and dependent origination"
    description: "Actions have morally weighted consequences; all phenomena arise in dependence on conditions (pratityasamutpada)"

  - name: "Samsara and rebirth"
    description: "Beings cycle through conditioned existence across lives driven by karma and craving until liberation is attained"

  - name: "Nirvana is attainable"
    description: "Liberation from the cycle of suffering is possible in principle for all beings; the Buddha's attainment is proof of concept"

# Debts: Unresolved explanatory burdens
debts:
  - name: "Karma transmission without self"
    description: "If there is no permanent self (anatta), what carries karma across lives? The tension between rebirth and no-self is Buddhism's central internal paradox"

  - name: "Nirvana definition contested"
    description: "Is nirvana annihilation, a positive state, or beyond description? Theravada and Mahayana diverge significantly on this central goal"

  - name: "Rebirth mechanism"
    description: "What exactly transmigrates if not a soul? Buddhist philosophy has sophisticated answers but they remain empirically untestable"

  - name: "Early exclusion of women"
    description: "The Buddha's initial reluctance to ordain women, and subsequent gender hierarchies in Buddhist institutions, require honest reckoning"

