# Axioms: Foundational unprovable assumptions
# Source: Maimonides' 13 Principles of Faith (Rambam) — the canonical Orthodox creed
axioms:
  - name: "God exists"
    description: "The Creator exists necessarily, is incorporeal, eternal, and absolutely one (Maimonides principles 1-3)"

  - name: "Torah is divine"
    description: "The Written Torah (Tanakh) was given by God to Moses at Sinai; it is eternally authoritative and unalterable"

  - name: "Covenant with Israel"
    description: "God entered a unique, binding covenant with the Jewish people — this relationship is permanent and cannot be transferred"

  - name: "Oral Torah is binding"
    description: "The Oral Torah (Talmud, rabbinic tradition) was given at Sinai alongside Written Torah and is equally authoritative"

  - name: "Mitzvot are obligatory"
    description: "The 613 commandments are binding on all Jews; observance is not optional but covenantal obligation"

  - name: "Messianic expectation"
    description: "A personal Messiah will come, rebuild the Temple, and usher in a redemptive era for all humanity"

  - name: "Resurrection of the dead"
    description: "The physical dead will be resurrected in the messianic era; bodily resurrection is a core tenet"

# Debts: Unresolved explanatory burdens
debts:
  - name: "Theodicy / Holocaust"
    description: "How does a just God permit the destruction of 6 million Jews, including over a million children? The Shoah strains any theodicy."

  - name: "Religious diversity"
    description: "The particularity of Jewish covenant raises questions about the status and salvation of righteous non-Jews"

  - name: "Modern science tensions"
    description: "Biblical chronology, origins narratives, and some halakhic categories require reconciliation with evolutionary biology and cosmology"

  - name: "Gender and inclusion tensions"
    description: "Traditional gender roles in prayer, testimony, and leadership create ongoing tension with contemporary equality norms"

