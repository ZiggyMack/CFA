# Axioms: Foundational unprovable assumptions
# Source: Vedantic synthesis (Advaita, Vishishtadvaita, Dvaita); Smarta tradition
axioms:
  - name: "Brahman/Atman unity"
    description: "Ultimate reality (Brahman) is the ground of all being; the individual self (Atman) is identical to or deeply related with Brahman"

  - name: "Dharma as cosmic order"
    description: "Dharma is the eternal moral-cosmic order underlying reality; living in accord with dharma is the foundational ethical imperative"

  - name: "Karma"
    description: "Actions (karma) generate consequences that shape future experience within this life and across lives; moral causation is real"

  - name: "Samsara (cycle of rebirth)"
    description: "The soul transmigrates through multiple lives across species and cosmic epochs until liberation is attained"

  - name: "Moksha as highest liberation"
    description: "Liberation from samsara — through jnana (knowledge), bhakti (devotion), karma yoga (action), or raja yoga — is the supreme human goal"

  - name: "Vedas as sacred revelation"
    description: "The Vedas (shruti) are eternal, authorless revealed truth; they are the epistemic foundation of dharmic inquiry"

  - name: "Multiple valid paths"
    description: "Many paths (margas) lead to liberation; different traditions (Shaiva, Vaishnava, Shakta, Smarta) represent legitimate approaches to the same ultimate reality"

# Debts: Unresolved explanatory burdens
debts:
  - name: "Caste system implications"
    description: "The varna/jati system, traditionally grounded in karma and dharma, has enabled systemic oppression requiring ongoing philosophical reckoning"

  - name: "Internal school conflicts"
    description: "Advaita (non-dualism), Vishishtadvaita (qualified non-dualism), and Dvaita (dualism) reach incompatible conclusions about Brahman-Atman relationship"

  - name: "Science-cosmology tensions"
    description: "Puranic cosmology (vast cosmic timescales are actually close to modern estimates) coexists uneasily with evolutionary biology and geological timescales"

  - name: "Theodicy"
    description: "If karma explains suffering, what explains the first moment of suffering? The infinite regress of karma chains is philosophically difficult"

