# Axioms: Foundational unprovable assumptions
# Source: Sartre (Being and Nothingness), Heidegger (Being and Time), de Beauvoir, Camus
axioms:
  - name: "Existence precedes essence"
    description: "There is no pre-given human nature or purpose; humans exist first and then define themselves through choices and actions"

  - name: "Radical freedom"
    description: "Humans are 'condemned to be free' — we cannot escape choosing, even choosing not to choose is a choice; freedom is inescapable"

  - name: "Absolute responsibility"
    description: "Because we are radically free, we are fully responsible for what we are and do; we cannot authentically blame nature, God, or circumstance"

  - name: "Bad faith as fundamental failure mode"
    description: "Fleeing from freedom by pretending to be determined (by nature, role, or God) is bad faith — the paradigmatic existential failure"

  - name: "Authenticity as goal"
    description: "The existentialist imperative is to own one's freedom honestly, to live in accordance with one's genuine choices rather than social role or external authority"

  - name: "Facticity and transcendence"
    description: "Humans are always both thrown (facticity — our situation, body, past) and projecting (transcendence — our possibilities); neither pole can be collapsed"

# Debts: Unresolved explanatory burdens
debts:
  - name: "Freedom as burden (existential anxiety)"
    description: "Radical freedom produces anguish, not liberation — the absence of external guidance is experienced as vertigo, not freedom. Is the cure worse than the disease?"

  - name: "Groundlessness"
    description: "Without a stable foundation (God, nature, reason), what prevents existentialism from collapsing into arbitrary choice? Why prefer authenticity at all?"

  - name: "Underdeveloped positive moral framework"
    description: "Sartrean existentialism is better at critique (bad faith) than construction; de Beauvoir's ethics of ambiguity helps but the framework remains thin"

  - name: "Relativism risk"
    description: "If each person creates their own values, how do we criticize the authentic Nazi? Existentialists have responses, but the problem is genuinely difficult"

