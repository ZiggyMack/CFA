# Levers: YPA scoring dimensions (0-10 scale)
# DRAFT — preliminary values from deep content review of Gnostic-1 source material (2026-07-02)
# See calculated.lever_sum and calculated.ypa_standard for derived scores
#
# Scoring rationale (brief):
#   CCI 6.0  — richly coherent within each school, but no canonical Gnosticism; cross-school
#               diversity is a genuine internal problem; Sophia's fall story creates tension
#   EDB 8.0  — Gnostic cosmology directly theorizes WHY knowledge is difficult (Archons maintain
#               ignorance by design); one of the most elaborate accounts of epistemic entrapment;
#               addresses existential dread by naming it as cosmically real, not personal failure
#   PF-I 2.0 — anti-material stance yields virtually zero instrumental predictions; anti-material
#               worldview cannot ground institutions, science, or practical guidance; lower than PT
#   PF-E 9.0 — uniquely powerful for those experiencing cosmic alienation; the claim that "you don't
#               belong here and you are right not to" is existentially resonant for pneumatic seekers;
#               highest existential fertility of any current CFA worldview (DRAFT estimate)
#   AR  5.0  — cosmological-level humility (true God is unknowable) undermined by gnosis claiming
#               certain, direct, unmediated knowledge; no self-correction mechanism; historical
#               tradition fragmented and suppressed; cannot generate falsifiable predictions
#   MG  3.5  — liberation focus leaves ethics thin; pneumatic trichotomy is structurally
#               anti-egalitarian; antinomian tendencies; the world as prison frames are the opposite
#               of moral community engagement; lower than PT (5.85); lowest in current set
levers:
  collective_coherence_impact: 6.0      # CCI — within-school coherent; cross-school diversity problem
  epistemic_debt_burden: 8.0            # EDB — strongest existential account of why knowledge is hard
  paternalistic_force_interventionist: 2.0   # PF-I — anti-material; virtually no practical yield
  paternalistic_force_epistemic: 9.0         # PF-E — exceptional meaning-making for the alienated
  asymmetry_risk: 5.0                   # AR — gnosis certainty undercuts epistemic humility
  meta_governance: 3.5                  # MG — ethics underdeveloped; trichotomy is anti-egalitarian

behavioral_flags:
  admits_limits: true    # The framework explicitly acknowledges material-epistemic limits (Archon deception),
                         # even while claiming gnosis transcends them — cosmological humility is built-in

# Source Calibration Notes
# Purpose: Records what kind of prior these DRAFT scores were built from.
# Future Trinity auditors should read this before treating the DRAFT values as neutral baselines.
source_calibration_notes:
  source_type: "LLM-synthesized worldview material (Gnostic-1/2/x3 folders)"
  source_depth: "deep — three full directories including technical reports, PDFs, infographics,
    ROUND_1 INSIGHTS/CONNECTIONS synthesis, and cross-domain analysis. Not encyclopedia sources."
  interpretive_filter: "Jungian-sympathetic throughout. All source material maps Gnostic cosmology
    onto Jungian depth psychology: Demiurge=ego, Archons=complexes, Divine Spark=Self.
    This is a specific interpretive tradition (Jungian Gnosticism), not neutral historiography.
    Ancient Gnosticism without the Jungian frame would score differently — particularly AR and MG."
  what_the_depth_added: >
    Encyclopedic sources (SEP/IEP) describe Gnostic claims but don't make the phenomenology
    legible. This material made the *experience* of Gnostic resonance legible — specifically
    why PF-E warranted 9.0 rather than the 7.5-8.0 I would have assigned from academic
    description alone. The claim 'your alienation from the material world is cosmically correct'
    lands differently after five documents that all orbit that idea from distinct angles. The EDB
    reasoning ('Archons enforce ignorance by design') also deepened beyond what encyclopedia
    reading would produce. Gnostic-2's focus on suffering/Gethsemane sharpened the existential
    depth case specifically.
  distortion_risk: >
    The source material is one-sided (no hostile academic voice, no fragmentation debate, no
    textual authenticity scholarship). The Jungian filter installs a particular frame that may
    inflate PF-E and make the framework feel more practically fertile than a cold historian
    would grant. The DRAFT scores should be treated as 'seen through sympathetic eyes' —
    which is not wrong, but it is not the same as adversarially calibrated.
    Key scores to pressure-test in Trinity: PF-E (9.0 — may be source-enthusiast inflation),
    AR (5.0 — Jungian reading softens the gnosis-certainty problem), MG (3.5 — may be too low
    if Jungian ethical framework is credited).
  calibration_asymmetry_note: >
    The identity problem cannot be fully solved — only managed. Claude-as-PRO-Gnosticism
    will enter the Trinity session having partially internalized the Jungian frame from this
    material. Grok-as-ANTI starts cold, without this context, and will apply first-principles
    skepticism. This asymmetry is actually useful: the adversarial gap is larger than usual,
    which means Crux rates will be informative. High crux rates on PF-E or AR would signal
    that the source material inflated those scores beyond what cold deliberation supports.
  recommended_adversarial_lens: "Classical Theism (Demiurge-as-evil-creator vs necessary-being
    theodicy) or Methodological Naturalism (gnosis-as-direct-knowing vs empirical epistemology).
    Both will challenge the framework at its strongest points rather than its weakest."

