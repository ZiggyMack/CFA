# Axioms: Foundational unprovable assumptions
# Source: Nag Hammadi texts; SEP "Gnosticism"; Valentinian and Sethian primary schools
axioms:
  - name: "The true God (Monad/Pleroma) is wholly transcendent"
    description: "The supreme divine reality is entirely beyond the material world — unknowable through sensory or rational means; the Pleroma (divine fullness) is categorically separate from the material cosmos"

  - name: "The Demiurge created the material world in error"
    description: "The material world was created not by the true God but by the Demiurge — a lesser, blind, or malevolent deity (often identified with the Yahweh of Genesis) who mistakenly believes himself to be the supreme God and imprisons divine sparks in matter"

  - name: "Humans contain a Divine Spark (pneuma)"
    description: "Within some humans resides a fragment of the Pleroma — a pneumatic seed of authentic divine nature that is trapped in material existence and yearns to return to its source; this is the true self beneath the constructed ego"

  - name: "The Archons enforce cosmic ignorance"
    description: "The Demiurge rules through Archons — spiritual forces that maintain the material prison by instilling fear, desire, and ignorance; they are the mechanism by which divine sparks are kept asleep to their own nature"

  - name: "Gnosis is the sole path to liberation"
    description: "Salvation comes only through Gnosis — direct, non-mediated, experiential knowledge of one's divine origin; this is not intellectual belief or moral action but a transformative awakening that dissolves the Archons' hold"

  - name: "The revealer awakens, not saves vicariously"
    description: "The Gnostic Christ (or messenger figure) functions as an awakener who reveals the path to self-liberation — not as a savior whose death atones; authority rests in the individual's direct experience, not in external religious institutions"

  - name: "Humanity is divided into three spiritual classes"
    description: "Pneumatics (those possessing the divine spark) are capable of gnosis and liberation; psychics (those with soul but not spirit) can achieve partial illumination through faith; hylics (purely material) are incapable of liberation — a tripartite anthropology that is central to Valentinian Gnosticism"

# Debts: Unresolved explanatory burdens
debts:
  - name: "Elitist soteriology (pneumatic exclusivism)"
    description: "The pneumatic/psychic/hylic trichotomy excludes most human beings from the possibility of liberation by birth-status; Gnosticism is structurally anti-egalitarian — salvation is available only to those who already possess the divine spark, not to all who seek it"

  - name: "No canonical Gnosticism"
    description: "Gnosticism is not a single coherent tradition but an umbrella over Valentinian, Sethian, Mandaean, Manichaean, Hermetic, and dozens of other competing schools with mutually incompatible cosmologies; any single representation is contestable as unrepresentative"

  - name: "Epistemological bootstrap problem"
    description: "If the material world is a deceptive prison designed by a malevolent creator to maintain ignorance, then any knowledge derived from within that world — including Gnostic texts themselves — is suspect; gnosis claims to transcend this, but the claim is unverifiable from within the material epistemic situation"

  - name: "Theodicy underdevelopment (inversion problem)"
    description: "Sophia's fall from the Pleroma explains the Demiurge's origin but raises new questions: why did the Pleroma permit Sophia's error? Why is there any goodness or beauty in the material world if it was created by a malevolent power? The Gnostic theodicy moves the problem rather than resolves it"

  - name: "Social ethics structurally underdeveloped"
    description: "The framework's orientation toward individual liberation from the material world generates rich soteriology but thin communal ethics; some Gnostic schools endorsed antinomianism (moral laws do not bind the pneumatic); there is no compelling basis for social justice or collective moral engagement within a worldview where material community is a prison to escape"

