      identity_delta_grok: -1.73
      divergence_layer: "Beliefs"
      notes: "Most contested by rounds (5.0 avg). Grok σ=1.14 reflects genuine philosophical variance — samples between 'architecture coherent but unverifiable' (~6.8) and 'these are not testable claims' (~4.0). Identity drops Grok sharply; Claude slightly up."

