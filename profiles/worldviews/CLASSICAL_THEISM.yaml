      combined_midpoint: 7.7
      stability: "high"
      crux_rate: "4/10"
      identity_delta_claude: -1.09
      identity_delta_grok: -1.87
      divergence_layer: "Definitions"
      notes: "Most stable score ranges (Claude σ=0.21, Grok σ=0.34) despite highest crux rate (4/10). Control baseline 9.2/9.1 — 800 years of Aquinas/Aristotle is agreed fact for naked models. Identity forces definitional specificity, creating a persistent boundary: 'pedigree = historical depth' (Claude) vs 'pedigree = empirical traction' (Grok). Crux at 90.4% convergence is consistent, not unstable."

