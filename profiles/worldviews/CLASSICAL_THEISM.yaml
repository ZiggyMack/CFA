      crux_rate: "0/10"
      identity_delta_claude: -0.08
      identity_delta_grok: -2.44
      divergence_layer: "Beliefs"
      notes: "Largest identity gap for Grok (Δ=-2.44). Empirical lens most effective here — CT's causal claims (final causality, participation) are precisely what empiricism targets. No crux declarations despite wide spread; auditors accept the impasse without formalizing it."

