# Total runs: 17 (7 hardcoded identity + 10 external identity)
# Recommended condition: external_identity (LITE files loaded from VUDU_NETWORK)
# Note: MdN was the adversarial lens, not the subject. Symmetric MdN-as-subject run needed.
