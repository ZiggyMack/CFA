      stability: "medium"
      crux_rate: "0/10"
      identity_delta_claude: 1.35
      identity_delta_grok: -0.20
      divergence_layer: "Beliefs"
      notes: "Only metric where identity RAISES Claude (+1.35). The 5-Part Scaffold's systematic approach (counterweight table, edge case ledger) may provide genuine analytical value for logical analysis. Control scores lowest here (6.3/6.6) — without scaffolding, models find CT's logical structure less compelling."

