      divergence_layer: "Beliefs"
      notes: "Narrowest spread (0.9) and fastest convergence after IP (2.6 rounds, 90.8%). Both lenses credit CT's historical influence on ethics, law, and culture. Diverge on what CT delivers in contemporary practice."

