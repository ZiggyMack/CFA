# Methodological Naturalism - Canonical Score Data
# Purpose: Machine-readable YPA scores for validation and calculation
# Source: Extracted from METHODOLOGICAL_NATURALISM.md (v0.3.0)
# Usage: ypa_validator.py, empirical verification, Grok validation
# Last Updated: 2025-11-15

profile:
  name: "Methodological Naturalism"
  version: "0.4.0"
  status: "VALIDATED"
  declared_axiom: "The natural world operates according to consistent, discoverable laws without supernatural intervention; knowledge claims require empirical evidence and methodological rigor"
  alternate_names:
    - "Scientific Naturalism"
    - "Methodological Physicalism"
    - "Empirical Naturalism"
  last_updated: "2026-07-02"
  maintainers:
    - "Ziggy"
    - "Grok"
    - "C4"
    - "Nova"

# Axioms: Foundational unprovable assumptions
axioms:
  - name: "Regularity exists"
    description: "The universe operates according to consistent patterns"

  - name: "Cognition is reliable"
    description: "Our minds can track reality (at least approximately)"

  - name: "Testing arbitrates"
    description: "Empirical testing can distinguish better from worse explanations"

  - name: "Natural causation default"
    description: "Assume natural causes unless evidence suggests otherwise"

  - name: "Parsimony works"
    description: "Simpler explanations are generally more likely to be true"

  - name: "Findings are provisional"
    description: "All conclusions remain open to revision"

# Debts: Unresolved explanatory burdens
debts:
  - name: "Why does regularity exist?"
    description: "No explanation for why universe has laws"

  - name: "Why does cognition track truth?"
    description: "Evolution explains survival, not truth-tracking"

  - name: "Why does success = truth?"
    description: "Pragmatic utility doesn't guarantee metaphysical accuracy"

  - name: "Where does morality come from?"
    description: "Naturalistic accounts of ethics remain contested"

# Levers: VuDu Light scoring dimensions (0-10 scale)
# Source: Trinity² Phase 2 golden final scores (n=10, adversarial deliberation)
# Experiment: TRINITY2-PHASE2-20260630, condition 3/ (MdN golden, Claude ANTI-MdN / Grok PRO-MdN)
# MdN identity effects weaker and mixed vs CT; CCI and MG actually rise with identity.
levers:
  collective_coherence_impact: 6.81    # CCI — Phase 2 golden final (sd=0.36); prior 8.0, Δ=+0.57 (identity RAISES)
  epistemic_debt_burden: 6.49          # EDB — Phase 2 golden final (sd=0.38); prior 7.5, Δ=-0.88
  paternalistic_force_interventionist: 8.07  # PF-I — Phase 2 golden final (sd=0.43); prior 10.0, Δ=-1.21 (extreme prior corrected)
  paternalistic_force_epistemic: 4.54       # PF-E — Phase 2 golden final (sd=0.51); prior 3.0, Δ=+0.03 (floor confirmed)
  asymmetry_risk: 6.32                 # AR  — Phase 2 golden final (sd=0.41); prior 7.0, Δ=-0.13 (stable)
  meta_governance: 4.82                # MG  — Phase 2 golden final (sd=0.37); prior 4.0, Δ=+0.34 (identity RAISES)

# Behavioral flags
behavioral_flags:
  admits_limits: true

