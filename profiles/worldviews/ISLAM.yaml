# Axioms: Foundational unprovable assumptions
# Source: Arkan al-Iman (Six Pillars of Faith) + Shahada
axioms:
  - name: "Tawhid (Divine Unity)"
    description: "God (Allah) is absolutely one, indivisible, and without partner or equal"

  - name: "Prophethood of Muhammad"
    description: "Muhammad is the final and seal of the prophets; his revelation supersedes all prior revelations"

  - name: "Quran as divine word"
    description: "The Quran is the literal, uncreated word of God — perfectly preserved and universally binding"

  - name: "Angels"
    description: "Non-material beings created from light who carry out divine commands and record human deeds"

  - name: "Day of Judgment"
    description: "All humans will be resurrected and judged according to their beliefs and deeds; heaven and hell are real"

  - name: "Divine decree (Qadar)"
    description: "Everything that occurs is within God's foreknowledge and will — human agency exists within divine providence"

  - name: "Life after death (Akhirah)"
    description: "The afterlife is the ultimate, permanent domain; earthly life is preparation for it"

# Debts: Unresolved explanatory burdens
debts:
  - name: "Problem of evil"
    description: "How does an omnipotent, benevolent God permit suffering, especially for the innocent?"

  - name: "Religious diversity"
    description: "Why do equally sincere non-Muslims lack the means of salvation? What of those who never heard the message?"

  - name: "Scriptural interpretation conflicts"
    description: "Disagreements between Sunni, Shia, Sufi, and other schools on authoritative interpretation of Quran and Hadith"

  - name: "Science-revelation tensions"
    description: "Apparent conflicts between Quranic cosmology/biology and modern scientific consensus require ongoing reconciliation"

