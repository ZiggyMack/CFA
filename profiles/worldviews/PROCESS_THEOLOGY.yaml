      identity_delta_claude: +0.75
      identity_delta_grok: +0.11
      divergence_layer: "Expectations"
      notes: "Lowest absolute scores for both auditors — PT's acknowledged practical weakness, consistent with its thin eschatology and limited prescriptive program. Unusual pattern: identity RAISES both auditors (Claude +0.75, Grok +0.11), the only metric where both move positive. Control cold-scores PT PS at 4.93/4.78 — without calibration, models find PT practically marginal. PRO identity surfaces PT's real practical achievements: Cobb's ecological theology, Griffin's consciousness research, pastoral applications of God-as-companion-in-suffering. Grok ANTI calibration doesn't particularly penalize PT for being practically thin — empiricist lens already expects metaphysical systems to be practically marginal, so there's little to reduce. Positive identity effect is diagnostic: PT's practical contributions require deliberate attention to surface; they don't announce themselves the way CT's or MdN's do. Expectation dispute: what counts as 'practical significance' for a speculative metaphysical theology."

