profile:
  name: "Process Theology"
  version: "0.4.0"
  status: "VALIDATED"
  declared_axiom: "God and world are mutually constituted through an ongoing creative process; God is not omnipotent but persuasive, and grows through relationship with creation"
  alternate_names:
    - "Whiteheadian Theology"
    - "Process-Relational Theology"
    - "Open Theism (adjacent)"
  last_updated: "2026-07-01"
  maintainers:
    - "Ziggy"
    - "CFA-Claude"

# Axioms: Foundational unprovable assumptions
# Source: Whitehead's Process and Reality; Hartshorne's dipolar theism; Cobb & Griffin
axioms:
  - name: "Reality is process, not substance"
    description: "The fundamental units of reality are events/occasions of experience, not static substances; becoming precedes being"

  - name: "God is dipolar"
    description: "God has a primordial nature (eternal, unchanging conceptual vision of all possibilities) and a consequent nature (temporal, responsive, affected by the world)"

  - name: "God persuades, not coerces"
    description: "God acts by luring creatures toward greater beauty, truth, and goodness — never by overriding creaturely freedom. God is the ground of possibility, not control"

  - name: "All actual entities have experience"
    description: "Mentality and experience are present in all actual occasions to varying degrees; this is panpsychism, not mere projection"

  - name: "Creativity is ultimate"
    description: "The ultimate metaphysical category is creativity itself — the ongoing bringing-forth of novelty; God exemplifies creativity but does not monopolize it"

  - name: "Novelty is real and irreducible"
    description: "Genuine newness enters the world through each actual occasion's self-creation; determinism is false at the metaphysical level"

# Debts: Unresolved explanatory burdens
debts:
  - name: "Theodicy (God cannot prevent evil)"
    description: "God's inability to coerce is the solution to evil — but does a God who cannot prevent a child's suffering deserve worship? Is limitation a feature or a devastating bug?"

  - name: "Speculative metaphysics"
    description: "Process philosophy's metaphysical system is elaborate and largely unfalsifiable; it requires accepting Whitehead's system wholesale"

  - name: "Personal immortality unclear"
    description: "Whitehead's account of subjective immortality is thin; whether individuals survive death in any meaningful sense is contested"

  - name: "Empirical testability"
    description: "Process theology claims to be naturalistic-compatible but its core claims (divine luring, panpsychism) are not empirically testable"

